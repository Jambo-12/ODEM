# ==================== API connections ====================
# Read the text-embedding service API key only from OPENAI_API_KEY.
# OpenAI-compatible text-embedding endpoint; OPENAI_API_BASE can override it.
openai_api_base: "https://api.openai.com/v1"

# ==================== Plan, Reason, and Reflect language model ====================
# The open-source release fixes the primary reasoning model to DeepSeek-V4-Flash.
llm_provider: "deepseek"
deepseek_model: "deepseek-v4-flash"
# Read the API key only from DEEPSEEK_API_KEY.
# DEEPSEEK_API_BASE can override this endpoint.
deepseek_api_base: "https://api.deepseek.com"
# Language-model sampling temperature; 0 favors stable, deterministic structured output.
llm_temperature: 0.0
# Maximum automatic retries after one language-model request fails.
llm_max_retries: 5
# Timeout for one language-model request, in seconds.
llm_request_timeout: 120

# ==================== Experiment and graph control ====================
# Whether to ignore existing predictions and rerun; --rerun can enable this temporarily.
rerun: false
# Whether to record online inference time, node calls, and model token usage.
performance_tracking_enabled: true
# Maximum Reason passes per question; the third pass must return a best-effort answer.
max_iterations: 3
# Maximum concurrent LangGraph nodes; single-GPU visual inference uses 1.
graph_max_concurrency: 1

# ==================== Localization dual-vector retrieval ====================
# Number of candidate segments retained by fused retrieval in each round.
localization_top_k: 5
# Weight of the maximum cosine similarity across the four valid caption keys.
localization_textual_weight: 11.0
# Weight of ViCLIP video cosine similarity in the fused score.
localization_visual_weight: 18.0
# Remote model used to encode retrieval queries; it must match the model recorded in text PKLs.
localization_text_model: "text-embedding-3-large"
# Local ViCLIP model size; it must match the precomputed video vectors.
localization_viclip_size: "l"
# Local ViCLIP weights used to encode the current retrieval description.
localization_viclip_pretrained: "models/ViCLIP/ViClip-InternVid-10M-FLT.pth"
# Device for ViCLIP query encoding; CUDA_VISIBLE_DEVICES selects the physical GPU.
localization_device: "cuda"
# ==================== Perception and Attention vision model ====================
# Local Qwen2.5-VL directory; Perception and Attention share one resident instance.
perception_model_path: "models/Qwen2.5-VL-7B-Instruct"
# Local vision-model device; cuda uses the GPU exposed by CUDA_VISIBLE_DEVICES.
perception_device: "cuda"
# Uniform Perception sampling rate over the expanded candidate; 0.5 means one frame per 2 seconds.
perception_fps: 0.5
# Attention sampling rate for detailed inspection, in frames per second.
attention_fps: 2.0
# Maximum number of disjoint focus ranges concatenated for one Attention call.
attention_max_ranges: 3
# Maximum total duration of all focus ranges in one Attention call, in seconds.
attention_max_total_seconds: 15.0
# Maximum pixels per frame passed from Perception to Qwen2.5-VL.
perception_max_pixels: 151200
# Maximum pixels per Attention frame; higher resolution helps identify text and small objects.
attention_max_pixels: 235200
# Maximum new tokens generated by one Perception inference.
perception_max_new_tokens: 768
# Maximum new tokens generated by one Attention inference.
attention_max_new_tokens: 768
# Whether to burn absolute source timestamps into sampled frames.
perception_annotate_timestamps: true
# Whether to enable Flash Attention 2 for Qwen2.5-VL; set false when unavailable.
perception_use_flash_attention: true
# Whether to serialize the two visual nodes to protect the shared model.
perception_serialize_inference: true

# ==================== Perception speaker-aware ASR ====================
# Whether to run speaker-aware ASR before Perception; disable it for silent datasets.
perception_enable_asr: true
# Read the ASR API key only from DASHSCOPE_API_KEY.
# OpenAI-compatible ASR endpoint; DASHSCOPE_API_BASE can override it.
speaker_asr_api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
# Audio model that performs speaker attribution and utterance transcription.
speaker_asr_model: "qwen3.5-omni-flash"
# English prompt file sent to the audio model.
speaker_asr_prompt_path: "prompts/speaker_asr.txt"
# Temporary WAV sample rate; 16 kHz mono is sufficient and reduces upload size.
speaker_asr_audio_sample_rate: 16000
# Timeout for one ASR API request, in seconds.
speaker_asr_request_timeout: 180
# Number of automatic retries for network or server errors.
speaker_asr_api_retries: 5
# Number of model retries when the returned transcript cannot be parsed.
speaker_asr_validation_retries: 2
